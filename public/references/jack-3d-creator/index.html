<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Jack — 3D Creator portfolio reference landing page" />
  <title>Jack — 3D Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0c0c0c;--ice:#d7e2ea;--line:rgba(215,226,234,.2)}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;background:var(--ink)}
    body{font-family:Kanit,sans-serif;background:var(--ink);color:var(--ice);overflow-x:clip}
    a{color:inherit;text-decoration:none} button{font:inherit} img{display:block;max-width:100%}
    .gradient{background:linear-gradient(180deg,#646973,#bbccd7);-webkit-background-clip:text;background-clip:text;color:transparent}
    .fade{opacity:0;transform:translateY(36px);transition:opacity .8s cubic-bezier(.25,.1,.25,1),transform .8s cubic-bezier(.25,.1,.25,1)}
    .fade.visible{opacity:1;transform:none}
    .pill{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:16px 46px;color:white;text-transform:uppercase;letter-spacing:.15em;font-weight:500;background:linear-gradient(123deg,#18011f 7%,#b600a8 37%,#7621b0 72%,#be4c00);box-shadow:0 4px 4px rgba(181,1,167,.25),4px 4px 12px #7721b1 inset;outline:2px solid white;outline-offset:-4px;cursor:pointer}
    .hero{height:100svh;min-height:650px;position:relative;display:flex;flex-direction:column;padding:28px 40px 40px;overflow:hidden}
    nav{display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(14px,1.4vw,23px);font-weight:500;position:relative;z-index:20}
    nav a{transition:opacity .2s}nav a:hover{opacity:.7}
    .hero h1{font-size:17.2vw;line-height:.8;letter-spacing:-.055em;text-transform:uppercase;font-weight:900;white-space:nowrap;margin-top:3.5vh;text-align:center}
    .portrait{position:absolute;z-index:10;left:50%;bottom:0;width:min(38vw,520px);transform:translateX(-50%);will-change:transform}
    .portrait img{width:100%;filter:drop-shadow(0 25px 50px rgba(0,0,0,.45))}
    .hero-bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:20}
    .hero-bottom p{max-width:260px;text-transform:uppercase;font-size:clamp(12px,1.4vw,24px);font-weight:300;line-height:1.15;letter-spacing:.035em}
    .marquee{padding:150px 0 50px;overflow:hidden}
    .rail{display:flex;gap:12px;width:max-content;margin-bottom:12px;will-change:transform}
    .rail img{width:420px;height:270px;object-fit:cover;border-radius:24px;background:#1b1b1b}
    .about{min-height:100svh;position:relative;display:grid;place-items:center;padding:100px 24px;overflow:hidden}
    .about-inner{display:flex;flex-direction:column;align-items:center;gap:52px;position:relative;z-index:2;text-align:center}
    .section-title{font-size:clamp(64px,12vw,160px);line-height:.85;letter-spacing:-.05em;text-transform:uppercase;font-weight:900}
    .about p{max-width:620px;font-size:clamp(17px,2vw,25px);line-height:1.6;font-weight:500}
    .about p span{opacity:.2;transition:opacity .18s}
    .decor{position:absolute;width:clamp(105px,15vw,220px);object-fit:contain}.d1{left:3%;top:5%}.d2{left:9%;bottom:7%;width:clamp(90px,13vw,180px)}.d3{right:3%;top:5%}.d4{right:8%;bottom:7%}
    .services{background:white;color:var(--ink);border-radius:60px 60px 0 0;padding:120px 40px 150px}
    .services>.section-title{text-align:center;margin-bottom:90px}
    .service-list{max-width:1050px;margin:auto;border-top:1px solid rgba(12,12,12,.15)}
    .service{display:grid;grid-template-columns:32% 1fr;align-items:center;padding:42px 0;border-bottom:1px solid rgba(12,12,12,.15)}
    .service>strong{font-size:clamp(64px,10vw,140px);line-height:.8;font-weight:900}
    .service h3{text-transform:uppercase;font-size:clamp(21px,2.2vw,34px);font-weight:500;margin-bottom:10px}
    .service p{font-size:clamp(15px,1.6vw,20px);font-weight:300;line-height:1.55;opacity:.6;max-width:700px}
    .projects{position:relative;z-index:3;margin-top:-60px;background:var(--ink);border-radius:60px 60px 0 0;padding:120px 40px 180px}
    .projects>.section-title{text-align:center;margin-bottom:100px}
    .card-wrap{height:85vh;min-height:760px;position:relative}.project{position:sticky;top:90px;min-height:670px;border:2px solid var(--ice);border-radius:56px;background:var(--ink);padding:30px;overflow:hidden;transform-origin:center top}
    .project-head{display:grid;grid-template-columns:auto 1fr 1fr auto;align-items:center;gap:35px;margin-bottom:24px}.project-head>strong{font-size:clamp(58px,8vw,110px);line-height:.8}.project-head small{text-transform:uppercase;opacity:.55;letter-spacing:.12em}.project-head h3{text-transform:uppercase;font-size:clamp(20px,2.2vw,34px);font-weight:500}.ghost{border:2px solid var(--ice);background:transparent;color:var(--ice);border-radius:999px;padding:14px 32px;text-transform:uppercase;letter-spacing:.14em}
    .project-grid{display:grid;grid-template-columns:2fr 3fr;gap:14px}.project-side{display:grid;gap:14px}.project-grid img{width:100%;height:100%;object-fit:cover;border-radius:42px}.project-side img:first-child{height:210px}.project-side img:last-child{height:300px}.project-main{height:524px}
    footer{padding:20px 40px 55px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.12em;opacity:.55}
    @media(max-width:760px){.hero{padding:22px 18px 28px;min-height:600px}.hero h1{font-size:16vw;margin-top:45px}.portrait{width:75vw;bottom:16%}.hero-bottom p{max-width:145px}.pill{padding:13px 25px;font-size:12px}.marquee{padding-top:95px}.rail img{width:280px;height:180px;border-radius:18px}.decor{opacity:.46}.about-inner{gap:38px}.services,.projects{border-radius:38px 38px 0 0;padding:85px 18px 120px}.service{grid-template-columns:95px 1fr;gap:10px}.project-wrap{height:auto}.card-wrap{height:auto;min-height:0;margin-bottom:28px}.project{position:relative;top:0;min-height:0;border-radius:36px;padding:18px}.project-head{grid-template-columns:auto 1fr;gap:16px}.project-head small{display:none}.project-head .ghost{grid-column:1/-1}.project-grid{grid-template-columns:1fr}.project-side{grid-template-columns:1fr 1fr}.project-side img:first-child,.project-side img:last-child{height:160px}.project-main{height:340px}.projects>.section-title{margin-bottom:60px}footer{padding:20px 18px 40px;font-size:11px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fade{opacity:1;transform:none;transition:none}}
  </style>
</head>
<body>
  <main>
    <section class="hero" id="top">
      <nav class="fade"><a href="#about">About</a><a href="#services">Price</a><a href="#projects">Projects</a><a href="mailto:hello@jack.studio">Contact</a></nav>
      <h1 class="gradient fade">Hi, i'm Jack</h1>
      <div class="portrait fade"><img src="https://shrug-person-78902957.figma.site/_components/v2/d24c01ad3a56fc65e942a1f501eb73db42d7cf9a/Rectangle_40443.81459862.png" alt="Jack, 3D creator" /></div>
      <div class="hero-bottom"><p class="fade">A 3D creator driven by crafting striking and unforgettable projects</p><a class="pill fade" href="mailto:hello@jack.studio">Contact me</a></div>
    </section>
    <section class="marquee" aria-label="Selected visual work"><div class="rail rail-a"></div><div class="rail rail-b"></div></section>
    <section class="about" id="about">
      <img class="decor d1 fade" src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png" alt="" />
      <img class="decor d2 fade" src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png" alt="" />
      <img class="decor d3 fade" src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png" alt="" />
      <img class="decor d4 fade" src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png" alt="" />
      <div class="about-inner"><h2 class="section-title gradient fade">About me</h2><p id="reveal-text"></p><a class="pill fade" href="mailto:hello@jack.studio">Contact me</a></div>
    </section>
    <section class="services" id="services"><h2 class="section-title fade">Services</h2><div class="service-list" id="service-list"></div></section>
    <section class="projects" id="projects"><h2 class="section-title gradient fade">Project</h2><div id="project-list"></div></section>
  </main>
  <footer><span>Jack Studio © 2026</span><a href="#top">Back to top ↑</a></footer>
  <script>
    const gifs=['hero-space-voyage-preview-eECLH3Yc.gif','hero-codenest-preview-Cgppc2qV.gif','hero-vex-ventures-preview-BczMFIiw.gif','hero-stellar-ai-v2-preview-DjvxjG3C.gif','hero-asme-preview-B_nGDnTP.gif','hero-transform-data-preview-Cx5OU29N.gif','hero-vitara-preview-Cjz2QYyU.gif','hero-terra-preview-BFjrCr7T.gif','hero-skyelite-preview-DHaZIgUv.gif','hero-aethera-preview-DknSlcTa.gif','hero-designpro-preview-D8c5_een.gif','hero-stellar-ai-preview-D3HL6bw1.gif','hero-xportfolio-preview-D4A8maiC.gif','hero-orbit-web3-preview-BXt4OttD.gif','hero-nexora-preview-cx5HmUgo.gif','hero-evr-ventures-preview-DZxeVFEX.gif','hero-planet-orbit-preview-DWAP8Z1P.gif','hero-new-era-preview-CocuDUm9.gif','hero-wealth-preview-B70idl_u.gif','hero-luminex-preview-CxOP7ce6.gif','hero-celestia-preview-0yO3jXO8.gif'].map(x=>'https://motionsites.ai/assets/'+x)
    const fillRail=(selector,items)=>document.querySelector(selector).innerHTML=[...items,...items,...items].map((src,i)=>`<img src="${src}" alt="3D motion project ${i%items.length+1}" loading="lazy">`).join('')
    fillRail('.rail-a',gifs.slice(0,11));fillRail('.rail-b',gifs.slice(11))
    const about="With more than five years of experience in design, i focus on branding, web design, and user experience, i truly enjoy working with businesses that aim to stand out and present their best image. Let's build something incredible together!"
    document.querySelector('#reveal-text').innerHTML=[...about].map(c=>`<span>${c===' '?'&nbsp;':c}</span>`).join('')
    const services=[['3D Modeling','Creation of detailed objects, characters, or environments tailored to specific client needs, ideal for games, products, and visualizations.'],['Rendering','High-quality, photorealistic renders that showcase designs with custom lighting, textures, and materials to bring concepts to life.'],['Motion Design','Dynamic animations and motion graphics that add energy and storytelling to brands, products, and digital experiences.'],['Branding','Crafting cohesive visual identities — from logos to full brand systems — that communicate a clear and memorable presence.'],['Web Design','Designing clean, modern, and conversion-focused websites with attention to layout, typography, and user experience.']]
    document.querySelector('#service-list').innerHTML=services.map((s,i)=>`<article class="service fade"><strong>${String(i+1).padStart(2,'0')}</strong><div><h3>${s[0]}</h3><p>${s[1]}</p></div></article>`).join('')
    const base='https://images.higgs.ai/?default=1&output=webp&url=', raw=[['Nextlevel Studio','Client',['hf_20260412_055344_5eff02e0-87a5-41ce-b64f-eb08da8f33db.png','hf_20260412_055431_11d841fd-8b41-46a5-82e4-b04f2407a7d8.png','hf_20260412_055451_e317bf2d-28d4-48cc-86b0-6f72f25b6327.png']],['Aura Brand Identity','Personal',['hf_20260412_055654_911201c5-36d9-4bc6-bac7-331adfce159f.png','hf_20260412_055723_5ceda0b8-d9c2-4665-b2e3-83ba19ba76d1.png','hf_20260412_055753_adc5dcbd-a8e6-49c0-b43a-9b030d835cea.png']],['Solaris Digital','Client',['hf_20260412_055759_963cfb0b-4bd1-4b0f-9d0a-09bd6cf95b2f.png','hf_20260412_060108_438f781a-9846-4dcc-89ab-c4e6cb830f5b.png','hf_20260412_055818_9d062121-ad7e-46b9-999a-1a6a692ef1ee.png']]]
    const img=n=>base+encodeURIComponent('https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/'+n)+'&w=1280&q=85'
    document.querySelector('#project-list').innerHTML=raw.map((p,i)=>`<div class="card-wrap"><article class="project" data-card="${i}"><div class="project-head"><strong>${String(i+1).padStart(2,'0')}</strong><small>${p[1]}</small><h3>${p[0]}</h3><button class="ghost">Live project</button></div><div class="project-grid"><div class="project-side"><img src="${img(p[2][0])}" alt="${p[0]} detail"><img src="${img(p[2][1])}" alt="${p[0]} detail"></div><img class="project-main" src="${img(p[2][2])}" alt="${p[0]}"></div></article></div>`).join('')
    const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.08,rootMargin:'0px 0px -5%'});document.querySelectorAll('.fade').forEach(el=>observer.observe(el))
    const portrait=document.querySelector('.portrait');portrait.addEventListener('mousemove',e=>{const r=portrait.getBoundingClientRect();portrait.style.transform=`translateX(-50%) translate3d(${(e.clientX-r.left-r.width/2)/3}px,${(e.clientY-r.top-r.height/2)/3}px,0)`});portrait.addEventListener('mouseleave',()=>portrait.style.transform='translateX(-50%)')
    let ticking=false;addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{const mq=document.querySelector('.marquee'),offset=(scrollY-mq.offsetTop+innerHeight)*.3;document.querySelector('.rail-a').style.transform=`translateX(${offset-200}px)`;document.querySelector('.rail-b').style.transform=`translateX(${-offset+200}px)`;const p=document.querySelector('#reveal-text').getBoundingClientRect(),progress=Math.max(0,Math.min(1,(innerHeight*.8-p.top)/(innerHeight*.6)));document.querySelectorAll('#reveal-text span').forEach((s,i,a)=>s.style.opacity=i/a.length<progress?'1':'.2');document.querySelectorAll('[data-card]').forEach((c,i)=>{const r=c.parentElement.getBoundingClientRect(),v=Math.max(0,Math.min(1,-r.top/innerHeight));c.style.transform=`scale(${1-(2-i)*.03*v})`});ticking=false})},{passive:true})
  </script>
</body>
</html>
